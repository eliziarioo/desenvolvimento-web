<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja | (Exemplo Prompt)</title>
</head>
<body>
    <header>
        <h1 id="titulo">Minha Loja</h1>
    </header>
    <main id="main1">
        <p class="produto">Produto 1</p>
        <p class="produto">Produto 2</p>
        <p class="produto">Produto 3</p>
    </main>
    <footer>
        &copy; 2026 - Todos os direitos reservados
    </footer>

    <script>
        // Exemplo de manipulação do DOM (Document Object Model) com JavaScript

       const nome = window.prompt("Olá, qual é o seu nome?"); // Exibe uma mensagem de prompt na tela do usuário e armazena a resposta na variável "nome"
       console.log(`Olá ${nome}, seja bem-vindo(a) a minha loja de produtos Apple!`); // Exibe uma mensagem de boas-vindas no console(inspecionar no navegador

    </script>
</body>
</html>
