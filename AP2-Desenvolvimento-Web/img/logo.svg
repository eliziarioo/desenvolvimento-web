<!-- REQ 1.1 Header: logo em SVG (arquivo local na subpasta img/) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="logo-titulo">
  <title id="logo-titulo">PokéColeção</title>
  <defs>
    <linearGradient id="g-topo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a5f"/>
      <stop offset="1" stop-color="#d62839"/>
    </linearGradient>
  </defs>
  <!-- metade superior -->
  <path d="M4 32a28 28 0 0 1 56 0H43a11 11 0 0 0-22 0Z" fill="url(#g-topo)"/>
  <!-- metade inferior -->
  <path d="M4 32h17a11 11 0 0 0 22 0h17a28 28 0 0 1-56 0Z" fill="#f5f6fb"/>
  <!-- contorno e faixa central -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#161b45" stroke-width="4"/>
  <path d="M4 32h17M43 32h17" stroke="#161b45" stroke-width="4"/>
  <!-- botão central -->
  <circle cx="32" cy="32" r="8" fill="#ffcb05" stroke="#161b45" stroke-width="4"/>
  <!-- brilho -->
  <path d="M16 18a20 20 0 0 1 9-6" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".7"/>
</svg>
