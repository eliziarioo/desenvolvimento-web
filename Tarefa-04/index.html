<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarefa 4 - Validação de Formulário</title>
    <!-- Requisito 5 – estilização com CSS externo -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <!-- Requisito 2 – formulário com os campos Nome, E-mail e CPF -->
      <div class="container-form">
        <form id="formulario">
          <h1>Formulário de Cadastro</h1>

          <!-- Requisito 3 – sem validação no HTML (sem type="email", required ou pattern) -->
          <div class="campo">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" />
            <!-- Requisito 3 – span de erro logo abaixo do input -->
            <span id="erro-nome" class="erro"></span>
          </div>

          <div class="campo">
            <label for="email">E-mail:</label>
            <input type="text" id="email" name="email" placeholder="exemplo@email.com" />
            <span id="erro-email" class="erro"></span>
          </div>

          <div class="campo">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" />
            <span id="erro-cpf" class="erro"></span>
          </div>

          <button type="submit">Enviar</button>
        </form>

        <!-- Requisito 3 – div sobreposta ao formulário com mensagem de sucesso -->
        <div id="sucesso" class="sucesso">
          <h2>Cadastro enviado!</h2>
          <p>Obrigado, <span id="nome-sucesso"></span>. Seus dados foram enviados com sucesso.</p>
          <button type="button" id="voltar">Voltar</button>
        </div>
      </div>
    </main>

    <!-- Requisito 1 – página HTML linkada ao arquivo script.js externo -->
    <script src="script.js"></script>
  </body>
</html>
