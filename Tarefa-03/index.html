<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de compras dinâmica</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Lista de compras</h1>

      <!-- Requisito 1: um div contendo uma lista e dois botões. -->
      <div>
        <!-- Requisito 2: os itens li serão criados pelo JavaScript. -->
        <ul id="lista-frutas"></ul>
        <!-- Requisito 3: botão que chama a função de adicionar. -->
        <button id="botao-adicionar" type="button">Adicionar fruta</button>
        <!-- Requisito 4: botão que chama a função de retirar. -->
        <button id="botao-retirar" type="button">Retirar fruta</button>
      </div>
    </main>
  </body>
</html>
